name: Release

# Triggered when release-please merges its release PR and publishes the release.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  # ── Build web once and cache it for subsequent jobs ─────────────────────────
  web:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci && npm run build

      - name: Upload webdist
        uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: pkg/httpapi/webdist/

  # ── Cross-compile standalone binaries and attach them to the GitHub release ──
  binaries:
    name: Build binaries
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download webdist
        uses: actions/download-artifact@v4
        with:
          name: webdist
          path: pkg/httpapi/webdist/

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X github.com/splattner/vdcgo/pkg/vdcgo.Version=${{ github.event.release.tag_name }}" \
            -o dist/vdcgo-daemon \
            ./cmd/vdcgo-daemon
          tar -czf dist/vdcgo-daemon-${{ matrix.suffix }}.tar.gz \
            -C dist vdcgo-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/*.tar.gz

  # ── Upload binaries to the release created by release-please ───────────────
  upload-assets:
    name: Upload release assets
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  # ── Build and push the standalone Docker image to GHCR ──────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build and push HA add-on images to GHCR ──────────────────────────────────
  ha-addon:
    name: HA add-on (${{ matrix.ha_arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ha_arch: aarch64
            platform: linux/arm64
            base: ghcr.io/homeassistant/aarch64-base:latest
          - ha_arch: amd64
            platform: linux/amd64
            base: ghcr.io/homeassistant/amd64-base:latest
          - ha_arch: armhf
            platform: linux/arm/v6
            base: ghcr.io/homeassistant/armhf-base:latest
          - ha_arch: armv7
            platform: linux/arm/v7
            base: ghcr.io/homeassistant/armv7-base:latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/ha-addon-${{ matrix.ha_arch }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
