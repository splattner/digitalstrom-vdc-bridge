name: digitalSTROM vDC Bridge
description: >-
  Virtual Device Connector (vDC) for digitalSTROM. Bridges MQTT, Tasmota,
  Zigbee2MQTT, WLED, and Home Assistant devices into the digitalSTROM ecosystem.
version: 0.1.16
slug: digitalstrom_vdc_bridge
url: https://github.com/splattner/digitalstrom-vdc-bridge
arch:
  - aarch64
  - amd64
init: false
host_network: true
host_dbus: true
map:
  - data:rw
image: ghcr.io/splattner/digitalstrom-vdc-bridge/ha-addon
ports:
  8999/tcp: null
  8340/tcp: 8340
ports_description:
  8999/tcp: >-
    vDC external Device API — port the built-in External Device API plugin
    listens on. Used by external scripts/programs to register as digitalSTROM
    devices. Must match the listen_port option below.
  8340/tcp: vDC API (protobuf) — listen on this port for incoming connections from dss
ingress: true
ingress_port: 8090
ingress_stream: false
homeassistant_api: true
panel_icon: mdi:home-automation
panel_title: digitalSTROM vDC Bridge
options:
  description: digitalSTROM vDC Bridge
  listen_port: 8999
  vdcapi_port: 8340
  non_local: true
  no_discovery: false
  no_auto: false
  use_avahi_dbus: true
schema:
  description: str
  listen_port: port
  vdcapi_port: port
  non_local: bool
  no_discovery: bool
  no_auto: bool
  use_avahi_dbus: bool
