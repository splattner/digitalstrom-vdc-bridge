name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  checks: write

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Standard conventional commit types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            revert
          # Require that the PR title starts with a type from the list above
          requireScope: false
          # Allow scope to be optional
          ignoreLabels: |
            ignore-semantic-pull-request
          # You can ignore this check for PRs with a specific label
